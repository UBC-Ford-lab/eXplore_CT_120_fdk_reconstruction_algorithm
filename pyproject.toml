[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "eXplore-CT-120-fdk-reconstruction"
version = "0.1.0"
description = "GPU-accelerated FDK cone-beam CT reconstruction for the GE eXplore CT 120 micro-CT scanner"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Falk Wiegmann"},
]
keywords = ["CT", "reconstruction", "FDK", "cone-beam", "micro-CT", "medical imaging"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy",
    "torch",
    "xmltodict",
    "imageio",
    "matplotlib",
    "cv2",
    "tqdm",
]

[project.urls]
Repository = "https://github.com/UBC-Ford-lab/eXplore_CT_120_fdk_reconstruction_algorithm"

[tool.setuptools.packages.find]
include = ["ct_core*"]

[tool.setuptools]
py-modules = ["fdk", "run_recon_on_vff_file"]
