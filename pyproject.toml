[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "eXplore-CT-120-fdk-reconstruction"
version = "0.1.0"
description = "GPU-accelerated FDK cone-beam CT reconstruction for the GE eXplore CT 120 micro-CT scanner"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Falk Wiegmann"},
]
keywords = ["CT", "reconstruction", "FDK", "cone-beam", "micro-CT", "medical imaging"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy",
    "scipy",
    "torch",
    "xmltodict",
    "imageio",
    "matplotlib",
    "opencv-python-headless",
    "tqdm",
]

[project.optional-dependencies]
iterative = ["astra-toolbox"]
wandb = ["wandb"]

[project.urls]
Repository = "https://github.com/UBC-Ford-lab/eXplore_CT_120_reconstruction_algorithms"

[tool.setuptools.packages.find]
include = ["ct_core*", "fdk*", "iterative*", "learning_based_iterative*"]

[tool.setuptools]
py-modules = ["run_fdk_recon", "run_iterative_recon", "run_learned_recon", "run_geometry_calibration", "run_volume_report"]
